locator: internal/cli/cobra_dev.go
meta:
  purpose: Define Cobra command wiring so CLI flags and subcommands map to the internal command runners consistently.
  responsibilities: Build root/subcommand trees; validate CLI args/flags; convert command results into Cobra-compatible errors.
  architecture_notes: Validation and error-shaping are centralized here so command logic stays focused on behavior while CLI UX remains uniform.
  function_list:
    - newBuildCobraCommand
    - newCobraRoot
    - newConfigCommand
    - newConfigValidateCobraCommand
    - newCovCobraCommand
    - newFormatCobraCommand
    - newLintCobraCommand
    - newReleaseCobraCommand
    - newRepoAuditCobraCommand
    - newRepoCommand
    - newRepoInitCobraCommand
    - newRepoUpdateCobraCommand
    - newReposCommand
    - newReposMineCobraCommand
    - newTestCobraCommand
    - noExtraArgs
    - resultToError
    - runWithCobra
    - shouldPrintRootHelp
    - validateColorFlag
  import_files_list:
    - encoding/json
    - errors
    - fmt
    - github.com/spf13/cobra
    - io
  language: go
