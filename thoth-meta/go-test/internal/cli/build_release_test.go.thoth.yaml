    - TestRunBuildLibraryModeSuccess
    - TestRunBuildRejectsUnknownConfiguredTargetFilter
    - TestRunBuildSuccessWritesChecksumAndSummary
    - TestRunBuildUsesConfiguredMainPackage
    - TestRunBuildWithoutSuffixUsesTargetSubdirsForMultipleTargets
    - TestRunReleaseFailsWhenTagExists
    - TestRunReleaseLibraryModeWithoutArtifacts
    - TestRunReleaseNotesFileModeRequiresPath
    - TestRunReleaseSuccess
    - TestRunReleaseSupportsNoSuffixModeWithMultipleTargets
    - setupBuildTargetAndPackagingStubs
    - setupHydrateBuildInfoTestEnv
    - stubReleaseCaptureArtifacts
  import_files_list:
    - archive/tar
    - archive/zip
    - bytes
    - compress/gzip
    - errors
    - github.com/flarebyte/gh-flarebyte/internal/buildinfo
