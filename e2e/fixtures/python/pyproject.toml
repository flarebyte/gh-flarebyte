[project]
name = "flarebyte-python-fixture"
version = "1.2.3"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.2", "coverage==7.8.0"]

[tool.coverage.run]
source = ["flarebyte_python_fixture"]

[tool.ruff]
target-version = "py310"
