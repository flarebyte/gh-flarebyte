name: Swift compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # These CLI binaries are used only for tests; automatic Git provenance is optional.
  # Keep Git's ownership checks enabled in the Linux containers.
  GOFLAGS: -buildvcs=false

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux amd64 / Swift 6.2.4
    runs-on: ubuntu-24.04
    container: swift:6.2.4-noble
    timeout-minutes: 20
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - name: Report toolchains
        run: |
          swift --version
          swift -print-target-info
          go version
          bun --version
      - name: Real Swift integration
        run: make test-swift-e2e

  macos:
    name: macOS arm64 / Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Xcode 16.2 supplies Swift 6.0.3; 26.2 exercises a newer Swift 6 toolchain.
        xcode: ['16.2', '26.2']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - name: Report toolchains
        run: |
          xcodebuild -version
          swift --version
          swift -print-target-info
          go version
          bun --version
      - name: Real Swift integration
        run: make test-swift-e2e
