name: Language compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Test CLI binaries do not need automatic Git provenance.
  GOFLAGS: -buildvcs=false

concurrency:
  group: languages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Eight platform/toolchain combinations per PR/push, followed by one aggregate gate.
jobs:
  core:
    name: Go and Dart stub tests / macOS arm64
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.6'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Release preflight unit tests
        run: python -m unittest discover -s script -p 'test_*.py'
      - name: Go tests and default E2E suite
        run: make test
      - name: Dependency core coverage floor
        env:
          GOCACHE: ${{ github.workspace }}/.gocache
          GOMODCACHE: ${{ github.workspace }}/.gomodcache
        run: |
          go test ./internal/dependencies -coverprofile=tmp/dependency-coverage.out
          go tool cover -func=tmp/dependency-coverage.out | awk '/^total:/ { sub(/%/, "", $3); found=1; if ($3+0 < 90) exit 1 } END { if (!found) exit 1 }'

  python:
    name: Python 3.12 with uv / macOS arm64
    runs-on: macos-15
    timeout-minutes: 15
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.6'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Install Python and report toolchains
        run: |
          uv python install 3.12
          uv --version
          uv python find
          go version
          bun --version
      - name: Real Python integration
        run: make test-python-e2e

  typescript:
    name: TypeScript library and CLI / macOS arm64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.6'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Report toolchains
        run: |
          node --version
          npm --version
          bun --version
          go version
      - name: Real TypeScript library and CLI integration
        run: make test-typescript-e2e

  rust:
    name: Rust stable and Kotlin JVM / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.6'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: cargo-llvm-cov
          fallback: none
      - name: Report toolchains
        run: |
          rustc --version
          cargo --version
          cargo llvm-cov --version
          go version
          bun --version
      - name: Real Rust integration
        run: make test-rust-e2e
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Report Kotlin JVM toolchain
        run: java -version
      - name: Real Kotlin library and CLI integration
        run: make test-kotlin-e2e

  swift-linux:
    name: Linux amd64 / Swift 6.2.4
    runs-on: ubuntu-24.04
    container: swift:6.2.4-noble
    timeout-minutes: 20
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.6'
      - name: Report toolchains
        run: |
          swift --version
          swift -print-target-info
          go version
          bun --version
      - name: Real Swift integration
        run: make test-swift-e2e

  swift-macos:
    name: macOS arm64 / Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Xcode 16.2 supplies Swift 6.0.3; 26.2 exercises a newer Swift 6 toolchain.
        xcode: ['16.2', '26.2']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.6'
      - name: Report toolchains
        run: |
          xcodebuild -version
          swift --version
          swift -print-target-info
          go version
          bun --version
      - name: Real Swift integration
        run: make test-swift-e2e

  # Add every new CI job to needs so CI passed covers the complete workflow.
  ci-passed:
    name: CI passed
    needs: [core, python, typescript, rust, swift-linux, swift-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            if [ "$result" != success ]; then
              echo "CI dependency result: $result"
              exit 1
            fi
          done
